<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="logoPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="logoCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Container -->
    <rect width="80" height="80" rx="20" fill="url(#logoPrimaryGrad)" />
    <!-- Back Card -->
    <rect x="18" y="14" width="44" height="40" rx="8" fill="#ffffff" fill-opacity="0.25" transform="rotate(-8 40 34)" />
    <!-- Front Card -->
    <rect x="18" y="19" width="44" height="42" rx="8" fill="#ffffff" />
    <!-- Card Content Line -->
    <rect x="25" y="26" width="20" height="4" rx="2" fill="url(#logoCardGrad)" />
    <!-- Synapse Icon -->
    <path d="M40 35 C37 35, 35 37, 35 40 C35 44, 40 47, 40 50 C40 47, 45 44, 45 40 C45 37, 43 35, 40 35 Z" fill="url(#logoCardGrad)" />
    <circle cx="40" cy="53" r="1.5" fill="url(#logoCardGrad)" />
  </g>

  <!-- Typography -->
  <text x="108" y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
    Memorize<tspan fill="#818cf8">Me</tspan>
  </text>
  <text x="110" y="76" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" letter-spacing="1.5">
    ACTIVE RECALL &amp; FLASHCARDS
  </text>
</svg>
